[build-system]
requires = [ "setuptools>=84.0.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "atlassian-agent"
version = "2.4.6"
description = "Comprehensive AI agent for Jira and Confluence management."
readme = "README.md"
classifiers = [ "Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12, <3.15"
dependencies = [ "scion-sdk[mcp]>=0.6.4,<0.7.0", "requests>=2.34.2", "atlassian-python-api>=5.0.5",]
[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@knuckles.team"

[project.license]
text = "MIT"

[project.optional-dependencies]
mcp = [ "scion-sdk[mcp]>=0.6.4,<0.7.0",]
all = [ "scion-sdk[mcp]>=0.6.4,<0.7.0",]
test = [
    "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
atlassian-mcp = "atlassian_agent.mcp_server:mcp_server"

[project.entry-points."scion_sdk.prompt_providers"]
atlassian-agent = "atlassian_agent.prompts"

# The one declared connector identity: the fleet name (SCION-CONNECTOR-CONTROL-R071).
[project.entry-points."scion_sdk.connector"]
atlassian-mcp = "atlassian_agent:connector"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["atlassian_agent/mcp/"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = "atlassian_agent/mcp/"

[tool.setuptools.package-data]
atlassian_agent = [ "mcp_config.json", "skills/**", "prompts/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]

[tool.vulture]
ignore_names = ["request", "config"]
exclude = [".venv", "venv", "tests/"]

[dependency-groups]
dev = [
    "bump2version>=1.0.1,<2",
    "pytest-timeout>=2.4.0",
]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]
